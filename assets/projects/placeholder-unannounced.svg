<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Abstract artwork: redacted development build panel">
  <defs>
    <linearGradient id="un-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141A26"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <pattern id="un-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="none"/>
      <path d="M0 0v14" stroke="#7FA9D8" stroke-opacity="0.10" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#un-bg)"/>
  <rect width="800" height="500" fill="url(#un-hatch)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 62h800M0 124h800M0 186h800M0 248h800M0 310h800M0 372h800M0 434h800"/>
    <path d="M62 0v500M124 0v500M186 0v500M248 0v500M310 0v500M372 0v500M434 0v500M496 0v500M558 0v500M620 0v500M682 0v500M744 0v500"/>
  </g>

  <!-- redacted content bars -->
  <g fill="#1F2939">
    <rect x="110" y="140" width="360" height="22" rx="3"/>
    <rect x="110" y="180" width="500" height="22" rx="3"/>
    <rect x="110" y="220" width="270" height="22" rx="3"/>
    <rect x="110" y="290" width="430" height="22" rx="3"/>
    <rect x="110" y="330" width="330" height="22" rx="3"/>
  </g>
  <g fill="#0A0D14">
    <rect x="110" y="140" width="360" height="22" rx="3" opacity="0.55"/>
    <rect x="110" y="180" width="500" height="22" rx="3" opacity="0.55"/>
    <rect x="110" y="220" width="270" height="22" rx="3" opacity="0.55"/>
    <rect x="110" y="290" width="430" height="22" rx="3" opacity="0.55"/>
    <rect x="110" y="330" width="330" height="22" rx="3" opacity="0.55"/>
  </g>

  <!-- header rule -->
  <path d="M110 104h580" stroke="#F2A93B" stroke-opacity="0.42" stroke-width="2"/>
  <rect x="110" y="80" width="132" height="10" rx="2" fill="#F2A93B" fill-opacity="0.34"/>

  <!-- lock glyph -->
  <g transform="translate(618 286)" fill="none" stroke="#F2A93B" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="26" width="52" height="38" rx="6"/>
    <path d="M18 26v-9a14 14 0 0 1 28 0v9"/>
  </g>

  <!-- frame -->
  <rect x="30" y="30" width="740" height="440" fill="none" stroke="#7FA9D8" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="10 8"/>

  <!-- corner ticks -->
  <g stroke="#F2A93B" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M28 28h34M28 28v34"/>
    <path d="M772 472h-34M772 472v-34"/>
  </g>
</svg>
