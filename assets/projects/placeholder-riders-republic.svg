<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Abstract artwork: layered ridgelines and a descending trail">
  <defs>
    <linearGradient id="rr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161F2E"/>
      <stop offset="55%" stop-color="#101724"/>
      <stop offset="100%" stop-color="#0A0E16"/>
    </linearGradient>
    <linearGradient id="rr-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A394F"/>
      <stop offset="100%" stop-color="#1B2637"/>
    </linearGradient>
    <linearGradient id="rr-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233042"/>
      <stop offset="100%" stop-color="#151E2C"/>
    </linearGradient>
    <linearGradient id="rr-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2432"/>
      <stop offset="100%" stop-color="#0E141E"/>
    </linearGradient>
    <linearGradient id="rr-trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC46B"/>
      <stop offset="100%" stop-color="#C4801E"/>
    </linearGradient>
    <radialGradient id="rr-sun" cx="0.72" cy="0.26" r="0.34">
      <stop offset="0%" stop-color="#F2A93B" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rr-sky)"/>
  <rect width="800" height="500" fill="url(#rr-sun)"/>

  <!-- horizon grid -->
  <g stroke="#7FA9D8" stroke-opacity="0.09" stroke-width="1">
    <path d="M0 150h800M0 200h800M0 250h800"/>
    <path d="M120 130v140M280 130v140M440 130v140M600 130v140M740 130v140"/>
  </g>

  <!-- ridgelines, far to near -->
  <path fill="url(#rr-far)" d="M0 268l96-58 74 40 88-64 92 52 84-46 106 66 92-40 68 32v250H0z"/>
  <path fill="url(#rr-mid)" d="M0 320l82-46 86 40 78-52 104 62 90-38 92 50 96-44 72 34v174H0z"/>
  <path fill="url(#rr-near)" d="M0 384l110-44 96 40 100-30 118 44 104-32 96 36 76-26v128H0z"/>

  <!-- descending trail -->
  <path d="M92 214c78 34 120 6 176 44s58 78 130 96 132-14 190 22"
        fill="none" stroke="url(#rr-trail)" stroke-width="3.2"
        stroke-linecap="round" stroke-dasharray="16 11" opacity="0.88"/>

  <!-- waypoint nodes -->
  <g fill="#0A0E16" stroke="#F2A93B" stroke-width="2">
    <circle cx="92" cy="214" r="6.5"/>
    <circle cx="398" cy="302" r="6.5"/>
    <circle cx="588" cy="376" r="6.5"/>
  </g>
  <circle cx="92" cy="214" r="13" fill="none" stroke="#F2A93B" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- corner ticks -->
  <g stroke="#F2A93B" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M28 28h34M28 28v34"/>
    <path d="M772 472h-34M772 472v-34"/>
  </g>
</svg>
